# Your experiences
experiences:
- company:
    name: The Associated Press
    location: New York, NY
  positions:
  - designation: Automated Web Scraper
    start: Aug 2026
    what I do:
    - I build tools that help the Associated Press collect election results from a wide range of sources. Using Python, I write reusable scripts to scrape and parse data from HTML pages, PDFs, and XML files, and turn it into structured data that can be used across election coverage.
    - Much of my work focuses on making these workflows repeatable, so we can collect and process results more efficiently as election night unfolds. In 2026, I worked for the 2026 primary and midterm elections.


- company:
    name: Reality Reload
    location: New York, NY
  positions:
  - designation: Community & Social Media Coordinator
    start: Oct 2026
    end: Dec 2026
    what I do:
    - I work on community and audience growth for Reality Reload, an indie narrative-driven game collection exploring the immigrant experience in America through satire and humor.
    - I curated a social media calendar to make sure social media content can be in sync with the gaming production phase. I developed social content for Instagram, X, and Xiaohongshu (RedNote) while managing player communities across Discord. A big part of my work is figuring out how to translate the game's themes and sense of humor for different audiences, especially across English- and Chinese-speaking communities.
    - I also organize playtests and community game nights to bring players into the development process, gather feedback, and build interest around key milestones. Alongside this, I work with streamers and content creators to introduce the game to new audiences and turn community interest into Steam wishlists.

