- company:
    name: Spectrum Education Group
    location: Irvine, CA
  positions:
  - designation: Marketing Assistant
    start: Jul 2024
    end: Jan 2026
    what I do:
    - I worked as a Marketing Assistant at Spectrum Education Group, a female-owned education startup in Southern California. It was a small team, so I got to work across different parts of the business, from social media and content production to marketing strategy and customer engagement.
    - I led the company's content strategy on Xiaohongshu (Rednote) and WeChat, creating videos and social content that combined market research with cultural storytelling. I also handled on-site filming and post-production, producing content that helped increase social media engagement by 30% and inbound inquiries by 12%.
    - Beyond content, I used customer data to look at where prospective families were dropping off in the consultation process. After identifying a 45% drop-off following consultations, I helped restructure the follow-up process, reducing response times by 30% and contributing to over $100K in incremental revenue.
    - I was also invited to host and speak at several annual events celebrating the Chinese community in Southern California.

