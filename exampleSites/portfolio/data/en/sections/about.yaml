# a summary about you
summary: "I'm Charlotte, a journalist and audience engagement practitioner working across storytelling, data, and community. I'm interested in how people discover, experience, and participate in journalism, and how we can create more meaningful connections between information and the people it serves. My experience spans newsroom production, audience development, social media strategy, data journalism, and digital communications. I've worked with editorial teams, built data-driven projects, developed social content, and explored ways to make journalism more accessible and participatory. I hold a master's degree from Columbia Journalism School and have continued to explore the intersection of journalism, technology, and audience engagement through The Lede. Based in New York City. Always curious about what else a story can become."

