name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: exampleSites/portfolio/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Install Dart Sass
        run: npm install --global sass@1.108.2

      - name: Install dependencies
        working-directory: exampleSites/portfolio
        run: |
          hugo mod tidy
          hugo mod npm pack
          npm install

      - name: Build
        working-directory: exampleSites/portfolio
        run: hugo --gc --minify --cleanDestinationDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSites/portfolio/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
